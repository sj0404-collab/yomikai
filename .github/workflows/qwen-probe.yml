name: Qwen3-TTS heavy probe (RU, C engine CPU)

on:
  workflow_dispatch:

jobs:
  qwen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Deps (OpenBLAS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenblas-dev
      - name: Fetch qwen3-tts C engine
        run: |
          curl -sL https://codeload.github.com/gabriele-mastrapasqua/qwen3-tts/tar.gz/refs/heads/main | tar xz
          mv qwen3-tts-main qtts
      - name: Build (blas)
        run: make -C qtts blas 2>&1 | tail -8
      - name: Download 0.6B model
        run: cd qtts && bash download_model.sh --model small --dir qwen3-tts-0.6b
      - name: Engine caps
        run: ./qtts/qwen_tts --caps || true
      - name: Generate RU samples
        run: cd qtts && bash ../tools/qwen_probe/make_samples.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-tts-probe-c
          path: qtts/out/*.wav
          retention-days: 7
