name: Emulator smoke (e2e)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза с APK (напр. v1.9.132)'
        required: true
        default: 'v1.9.132'
      autoread_seconds:
        description: 'Сколько секунд держать авточтение'
        required: false
        default: '180'

env:
  MIHON_GITHUB_RELEASE: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python + Pillow (генератор CBZ)
        run: |
          python3 -m pip install --quiet pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Скачать APK релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" -p "*.apk" -O yomikai.apk --clobber
          ls -la yomikai.apk

      - name: Сгенерировать тестовую CBZ
        run: |
          mkdir -p /tmp/cbz
          python3 ci/emulator/make_cbz.py /tmp/cbz
          ls -la /tmp/cbz

      - name: Запуск эмулятора и e2e smoke
        uses: reactive-circus/android-emulator-runner@d94c3fbbe3a1a54ae7c475929523d6b370963561 # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          disable-spellchecker: true
          headless: true
          emulator-boot-timeout: 900
          script: |
            export ART_DIR=/home/runner/work/_e2e-artifacts
            mkdir -p "$ART_DIR"
            export SECS_AUTO_READ=${{ inputs.autoread_seconds }}
            bash ci/emulator/smoke.sh "$PWD/yomikai.apk" /tmp/cbz/zen01.cbz

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: e2e-smoke-${{ github.run_number }}
          path: /home/runner/work/_e2e-artifacts

      - name: Отчёт в отчёт рана
        if: always()
        run: |
          echo '## Emulator smoke' >> "$GITHUB_STEP_SUMMARY"
          cat /home/runner/work/_e2e-artifacts/smoke_report.md >> "$GITHUB_STEP_SUMMARY" || echo "(отчёт не создан см. логи рана)" >> "$GITHUB_STEP_SUMMARY"
