<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <title>NPM Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e14;color:#e6edf3;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:28px;max-width:400px;padding:20px}
    .logo{font-size:32px;font-weight:800;background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
    .sub{font-size:13px;color:#8b949e;text-align:center;margin-top:-16px}
    .cards{display:flex;gap:16px;width:100%}
    .card{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 16px;background:#161b22;border:1px solid #30363d;border-radius:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:#e6edf3}
    .card:hover{border-color:#58a6ff;background:#1c2128;transform:translateY(-3px);box-shadow:0 8px 32px rgba(88,166,255,.15)}
    .card-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
    .card-title{font-size:16px;font-weight:700}
    .card-desc{font-size:11px;color:#8b949e;text-align:center;line-height:1.4}
    .footer{position:fixed;bottom:16px;font-size:10px;color:#484f58}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">◆ NPM Hub</div>
    <div class="sub">AI инструменты — выберите интерфейс</div>
    <div class="cards">
      <a class="card" href="/d">
        <div class="card-icon" style="background:rgba(88,166,255,.12);color:#58a6ff">🖥</div>
        <div class="card-title">Desktop</div>
        <div class="card-desc">ПК версия<br>Полный функционал</div>
      </a>
      <a class="card" href="/m" onclick="openNewTab(this, event)" title="Открыть в системном браузере, а не в webview приложения">
        <div class="card-icon" style="background:rgba(188,140,255,.12);color:#bc8cff">🌐</div>
        <div class="card-title">Открыть в браузере</div>
        <div class="card-desc">Кроссплатформенно<br>Без приложения</div>
      </a>
      <a class="card" href="/m">
        <div class="card-icon" style="background:rgba(63,185,80,.12);color:#3fb950">📱</div>
        <div class="card-title">Mobile</div>
        <div class="card-desc">Андроид версия<br>Сенсорный интерфейс</div>
      </a>
    </div>
  </div>
  <div class="footer">NPM Hub <span id="hub-version">…</span></div>
  <script>
    // Open in a real (system) browser tab instead of staying inside the app WebView.
    function openNewTab(el, event) {
      if (window.navigator.userAgent.indexOf('NpmHub/') !== -1 && !event.ctrlKey && !event.shiftKey && !event.metaKey) {
        event.preventDefault();
        open(el.href, '_blank');
        return false;
      }
      return true;
    }
    (async () => {
      try {
        const r = await fetch('/api/info');
        const j = await r.json();
        document.getElementById('hub-version').textContent = j.version || '';
      } catch (e) {}
    })();
  </script>
</body>
</html>
