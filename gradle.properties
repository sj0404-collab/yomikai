android.nonTransitiveRClass=false

kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
# Build performance optimizations
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.parallel=true

# Kotlin daemon optimizations
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.incremental.js=true

# Android build optimizations
android.enableJetifier=false
android.enableR8.fullMode=false

# Disable unnecessary features for faster builds
android.enableProguardInReleaseBuilds=false
# Gradle 9 удалил префикс unsafe- у конфигурационного кеша: старые ключи
# больше не распознаются (билд падает с ошибкой на runner'е).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
